<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas Semanales</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0b0b; color: #e0e0e0; display: flex; justify-content: center; padding: 20px; min-height: 100vh; }
        .container { width: 100%; max-width: 800px; background-color: #141414; border-radius: 30px; padding: 30px 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); border: 1px solid #2a2a2a; }
        h1 { text-align: center; color: #f2c94c; font-size: 2.5rem; font-weight: 600; letter-spacing: 2px; margin-bottom: 5px; }
        h1 span { font-size: 1.8rem; }
        .subtitle { text-align: center; color: #b0b0b0; margin-bottom: 30px; font-size: 1.1rem; }
        
        .week-controls { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 25px; }
        .week-controls h2 { font-size: 1.5rem; font-weight: 400; color: #e0e0e0; }
        .week-controls button { background: none; border: none; color: #f2c94c; font-size: 2rem; cursor: pointer; padding: 0 15px; }
        
        .day-row { display: flex; justify-content: space-between; align-items: center; background-color: #1e1e1e; border-radius: 15px; padding: 15px 20px; margin-bottom: 10px; border: 1px solid transparent; }
        .day-row.today { border-color: #f2c94c; background-color: #252525; }
        .day-label { font-weight: bold; color: #f2c94c; width: 120px; font-size: 1.1rem; }
        .slots-group { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; justify-content: flex-end; }
        .slot-btn { background-color: #2a2a2a; border: none; color: #888; padding: 6px 14px; border-radius: 20px; font-size: 0.9rem; cursor: default; transition: 0.2s; }
        .slot-btn.available { background-color: #f2c94c; color: #0b0b0b; cursor: pointer; font-weight: bold; }
        .slot-btn.available:hover { background-color: #ffda66; }
        
        #modalReserva { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #141414; padding: 30px; border-radius: 20px; max-width: 400px; width: 90%; border: 1px solid #333; }
        .modal-content h3 { margin-bottom: 15px; color: #f2c94c; }
        .modal-content input, .modal-content textarea { width: 100%; padding: 12px; margin: 8px 0; background: #1e1e1e; border: 1px solid #333; border-radius: 10px; color: #e0e0e0; }
        .modal-content button { width: 100%; padding: 12px; background: #f2c94c; border: none; border-radius: 10px; font-weight: bold; color: #0b0b0b; margin-top: 10px; cursor: pointer; }
        .close-modal { background: transparent !important; color: #888 !important; border: 1px solid #333 !important; }
        
        @media (max-width: 600px) { 
            .day-row { flex-direction: column; align-items: flex-start; gap: 10px; }
            .day-label { width: 100%; }
            .slots-group { justify-content: flex-start; width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1><span>✦</span> RESERVAS <span>✦</span></h1>
    <p class="subtitle">Seleccioná un día y horario disponible</p>

    <div class="week-controls">
        <button onclick="cambiarSemana(-7)">&#10094;</button>
        <h2 id="semanaTexto">Semana del 03 al 09 de Agosto</h2>
        <button onclick="cambiarSemana(7)">&#10095;</button>
    </div>

    <div id="listaSemanal">
        <!-- Aquí se generarán los días con sus horarios -->
    </div>
</div>

<!-- Modal -->
<div id="modalReserva">
    <div class="modal-content">
        <h3>Confirmar Reserva</h3>
        <p id="modalInfo" style="color: #aaa; margin-bottom: 15px;"></p>
        <input type="text" id="inputCliente" placeholder="Tu nombre completo">
        <input type="text" id="inputTelefono" placeholder="Tu teléfono (ej. 3518692251)">
        <textarea id="inputNotas" rows="2" placeholder="Notas adicionales (opcional)"></textarea>
        <button onclick="guardarReserva()">Confirmar Reserva</button>
        <button class="close-modal" onclick="cerrarModal()">Cancelar</button>
    </div>
</div>

<script>
    // CONFIGURACIÓN
    const API_URL = 'https://script.google.com/macros/s/AKfycbyzKD7CHpY5iFdiUQt6D1kbaMIwiHqPBH9TONcNnvIjhtUCqqsboKclaYoHYWu7IOnorCw/exec';
    const ALL_SLOTS = ['09:00','10:00','11:00','12:00','13:00','16:00','17:00','18:00','19:00','20:00','21:00'];

    let reservasGlobal = {};
    let fechaInicioSemana = new Date(); // Empieza en la fecha actual

    async function cargarReservas() {
        try {
            const response = await fetch(API_URL + '?action=getReservas');
            const data = await response.json();
            if (data.status === 'ok') {
                reservasGlobal = data.reservas || {};
                renderizarSemana();
            } else {
                console.error('Error:', data.mensaje);
            }
        } catch (error) {
            console.error('Error de conexión:', error);
        }
    }

    function formatearFechaServidor(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    }

    function renderizarSemana() {
        const container = document.getElementById('listaSemanal');
        container.innerHTML = '';
        
        const hoy = new Date();
        const nombreDias = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];

        // Calcular el inicio de semana (Lunes)
        let diaSemana = fechaInicioSemana.getDay();
        let diff = fechaInicioSemana.getDate() - (diaSemana === 0 ? 6 : diaSemana - 1); // Ajuste para que empiece en Lunes
        let lunes = new Date(fechaInicioSemana);
        lunes.setDate(diff);

        let domingo = new Date(lunes);
        domingo.setDate(lunes.getDate() + 6);

        document.getElementById('semanaTexto').textContent = 
            `Semana del ${String(lunes.getDate()).padStart(2,'0')} al ${String(domingo.getDate()).padStart(2,'0')} de ${domingo.toLocaleString('default', { month: 'long' })}`;

        for(let i = 0; i < 7; i++) {
            let fechaActual = new Date(lunes);
            fechaActual.setDate(lunes.getDate() + i);
            
            let fechaStr = formatearFechaServidor(fechaActual);
            let reservasDelDia = reservasGlobal[fechaStr] || [];
            let disponibles = ALL_SLOTS.filter(h => !reservasDelDia.includes(h));

            let row = document.createElement('div');
            row.className = 'day-row';
            
            // Resaltar el día de hoy
            if(fechaActual.toDateString() === hoy.toDateString()) {
                row.classList.add('today');
            }

            let label = document.createElement('div');
            label.className = 'day-label';
            label.textContent = `${nombreDias[i]} ${fechaActual.getDate()}`;

            let slotsGroup = document.createElement('div');
            slotsGroup.className = 'slots-group';

            ALL_SLOTS.forEach(hora => {
                let btn = document.createElement('button');
                btn.className = 'slot-btn';
                btn.textContent = hora;
                
                if(disponibles.includes(hora)) {
                    btn.classList.add('available');
                    btn.onclick = () => abrirModal(fechaStr, hora);
                }
                slotsGroup.appendChild(btn);
            });

            row.appendChild(label);
            row.appendChild(slotsGroup);
            container.appendChild(row);
        }
    }

    function cambiarSemana(dias) {
        fechaInicioSemana.setDate(fechaInicioSemana.getDate() + dias);
        renderizarSemana();
    }

    // Modal y Reserva
    let fechaReservaSeleccionada = '';
    let horaReservaSeleccionada = '';

    function abrirModal(fecha, hora) {
        fechaReservaSeleccionada = fecha;
        horaReservaSeleccionada = hora;
        document.getElementById('modalInfo').textContent = `📆 ${fecha} - 🕒 ${hora}`;
        document.getElementById('modalReserva').style.display = 'flex';
    }

    function cerrarModal() {
        document.getElementById('modalReserva').style.display = 'none';
    }

    async function guardarReserva() {
        const cliente = document.getElementById('inputCliente').value.trim();
        const telefono = document.getElementById('inputTelefono').value.trim();
        const notas = document.getElementById('inputNotas').value.trim();

        if (!cliente || !telefono) {
            alert('Completá tu nombre y teléfono.');
            return;
        }

        const formData = new FormData();
        formData.append('fecha', fechaReservaSeleccionada);
        formData.append('hora', horaReservaSeleccionada);
        formData.append('cliente', cliente);
        formData.append('telefono', telefono);
        formData.append('notas', notas);

        try {
            const response = await fetch(API_URL, { method: 'POST', body: formData });
            const text = await response.text();
            
            if (text === 'OK') {
                alert('✅ ¡Reserva confirmada!');
                cerrarModal();
                // Espera 2 segundos y recarga
                setTimeout(() => cargarReservas(), 2000);
            } else {
                alert('❌ Error: ' + text);
            }
        } catch (error) {
            alert('Error de conexión: ' + error.message);
        }
    }

    // Inicializar
    // Para que la semana empiece en la fecha actual, pero calcule el lunes actual:
    let hoy = new Date();
    let dia = hoy.getDay();
    let diffHoy = hoy.getDate() - (dia === 0 ? 6 : dia - 1);
    fechaInicioSemana = new Date(hoy);
    fechaInicioSemana.setDate(diffHoy);

    cargarReservas();
</script>
</body>
</html>
