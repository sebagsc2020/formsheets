<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas - Sebastián González</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0b0b;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background-color: #141414;
            border-radius: 30px;
            padding: 30px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 1px solid #2a2a2a;
        }
        h1 {
            text-align: center;
            color: #f2c94c;
            font-size: 2.5rem;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        h1 span {
            font-size: 1.8rem;
        }
        .subtitle {
            text-align: center;
            color: #b0b0b0;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        .month-header {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            margin-bottom: 25px;
        }
        .month-header h2 {
            font-size: 1.8rem;
            font-weight: 400;
            color: #e0e0e0;
        }
        .month-header button {
            background: none;
            border: none;
            color: #f2c94c;
            font-size: 2rem;
            cursor: pointer;
            padding: 0 15px;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }
        .weekday {
            text-align: center;
            color: #888;
            font-size: 0.9rem;
            font-weight: bold;
            padding: 10px 0;
            letter-spacing: 1px;
        }
        .day-box {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 10px 5px;
            text-align: center;
            min-height: 90px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            cursor: default;
        }
        .day-box.selected {
            border-color: #f2c94c;
            background-color: #252525;
        }
        .day-number {
            font-size: 1rem;
            font-weight: 500;
            color: #e0e0e0;
            margin-bottom: 5px;
        }
        .day-box.empty {
            background-color: transparent;
            min-height: auto;
        }
        .btn-elegir {
            background: #f2c94c;
            color: #0b0b0b;
            border: none;
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            margin: 5px 0 2px 0;
            transition: 0.2s;
        }
        .btn-elegir:hover {
            background: #ffda66;
        }
        .btn-reservar {
            background: transparent;
            border: 1px solid #f2c94c;
            color: #f2c94c;
            border-radius: 15px;
            padding: 2px 10px;
            font-size: 0.65rem;
            cursor: pointer;
            width: fit-content;
        }
        .btn-reservar:hover {
            background: #f2c94c;
            color: #0b0b0b;
        }
        .sin-turnos {
            color: #555;
            font-size: 0.65rem;
            margin-top: 5px;
        }

        /* Horarios del día seleccionado */
        .slots-container {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #2a2a2a;
            text-align: center;
            min-height: 60px;
        }
        .slots-container p {
            color: #888;
            font-size: 0.9rem;
        }
        .slots-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }
        .slot-item {
            background-color: #2a2a2a;
            color: #aaa;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: not-allowed;
        }
        .slot-item.available {
            background-color: #f2c94c;
            color: #0b0b0b;
            cursor: pointer;
            font-weight: bold;
        }
        .slot-item.available:hover {
            background-color: #ffda66;
        }
        .slot-item.selected-slot {
            background-color: #1e1e1e;
            border: 2px solid #f2c94c;
            color: #f2c94c;
        }
        
        #modalReserva {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #141414;
            padding: 30px;
            border-radius: 20px;
            max-width: 400px;
            width: 90%;
            border: 1px solid #333;
        }
        .modal-content h3 { margin-bottom: 15px; color: #f2c94c; }
        .modal-content input, .modal-content textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 10px;
            color: #e0e0e0;
        }
        .modal-content button {
            width: 100%;
            padding: 12px;
            background: #f2c94c;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            color: #0b0b0b;
            margin-top: 10px;
            cursor: pointer;
        }
        .close-modal {
            background: transparent !important;
            color: #888 !important;
            border: 1px solid #333 !important;
        }
        
        @media (max-width: 600px) {
            .day-box { min-height: 75px; padding: 8px 2px; }
            .btn-elegir { font-size: 0.7rem; padding: 3px 8px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1><span>✦</span> RESERVAS <span>✦</span></h1>
    <p class="subtitle">Seleccioná un día y horario disponible</p>

    <div class="month-header">
        <button onclick="cambiarMes(-1)">&#10094;</button>
        <h2 id="mesAnioTexto">Agosto 2026</h2>
        <button onclick="cambiarMes(1)">&#10095;</button>
    </div>

    <div class="calendar-grid" id="calendarioGrid">
        <div class="weekday">LUN</div>
        <div class="weekday">MAR</div>
        <div class="weekday">MIÉ</div>
        <div class="weekday">JUE</div>
        <div class="weekday">VIE</div>
        <div class="weekday">SÁB</div>
        <div class="weekday">DOM</div>
    </div>

    <div class="slots-container" id="slotsContainer">
        <p>Seleccioná un día del calendario para ver los horarios disponibles.</p>
    </div>
</div>

<!-- Modal para hacer la reserva -->
<div id="modalReserva">
    <div class="modal-content">
        <h3>Confirmar Reserva</h3>
        <p id="modalInfo" style="color: #aaa; margin-bottom: 15px;"></p>
        <input type="text" id="inputCliente" placeholder="Tu nombre completo">
        <input type="text" id="inputTelefono" placeholder="Tu teléfono (ej. 3518692251)">
        <textarea id="inputNotas" rows="2" placeholder="Notas adicionales (opcional)"></textarea>
        <button onclick="guardarReserva()">Confirmar Reserva</button>
        <button class="close-modal" onclick="cerrarModal()">Cancelar</button>
    </div>
</div>

<script>
    // ============================================================
    // CONFIGURACIÓN (URL exacta de tu captura de pantalla)
    // ============================================================
    const API_URL = 'https://script.google.com/macros/s/AKfycbzKD7CHpY5iFdiUQt6D1kbaMIwiHqPBH9TONcNnvIjhtUCqqsboKclaYoHYWu7IOnorCw/exec';
    const ALL_SLOTS = ['09:00','10:00','11:00','12:00','13:00','16:00','17:00','18:00','19:00','20:00','21:00'];

    let reservasGlobal = {};
    let currentYear = 2026;
    let currentMonth = 7; // 0 = Enero, 7 = Agosto
    let diaSeleccionado = null;
    let horaSeleccionada = null;

    // ============================================================
    // FUNCIÓN CLAVE CORREGIDA: Formatear fecha a YYYY-MM-DD
    // ============================================================
    function formatearFechaServidor(year, month, day) {
        const m = String(month + 1).padStart(2, '0');
        const d = String(day).padStart(2, '0');
        return `${year}-${m}-${d}`;
    }

    // ============================================================
    // OBTENER RESERVAS DEL SERVIDOR
    // ============================================================
    async function cargarReservas() {
        try {
            console.log('Cargando reservas desde:', API_URL + '?action=getReservas');
            const response = await fetch(API_URL + '?action=getReservas');
            const data = await response.json();
            
            if (data.status === 'ok') {
                reservasGlobal = data.reservas || {};
                console.log('Reservas cargadas:', reservasGlobal);
                renderizarCalendario();
                if (diaSeleccionado) mostrarHorarios(diaSeleccionado);
            } else {
                console.error('Error en datos:', data.mensaje);
            }
        } catch (error) {
            console.error('Error al conectar con el servidor:', error);
        }
    }

    // ============================================================
    // RENDERIZAR CALENDARIO
    // ============================================================
    function renderizarCalendario() {
        const grid = document.getElementById('calendarioGrid');
        // Limpiar días previos (dejar solo los encabezados)
        grid.innerHTML = `
            <div class="weekday">LUN</div>
            <div class="weekday">MAR</div>
            <div class="weekday">MIÉ</div>
            <div class="weekday">JUE</div>
            <div class="weekday">VIE</div>
            <div class="weekday">SÁB</div>
            <div class="weekday">DOM</div>
        `;

        const nombreMeses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
        document.getElementById('mesAnioTexto').textContent = `${nombreMeses[currentMonth]} ${currentYear}`;

        // Calcular días del mes
        const primerDia = new Date(currentYear, currentMonth, 1);
        const ultimoDia = new Date(currentYear, currentMonth + 1, 0);
        const totalDias = ultimoDia.getDate();

        // Día de la semana del primer día (0=Dom, 6=Sáb). 
        // Mapeamos al orden de nuestro grid (LUN=0, DOM=6)
        let diaSemanaInicio = primerDia.getDay(); // 0 (Dom) a 6 (Sáb)
        // Ajuste para que DOM sea la columna 6, LUN la 0
        let offset = (diaSemanaInicio + 6) % 7; 

        // Días vacíos al inicio
        for (let i = 0; i < offset; i++) {
            const emptyDiv = document.createElement('div');
            emptyDiv.className = 'day-box empty';
            grid.appendChild(emptyDiv);
        }

        // Días con números
        for (let day = 1; day <= totalDias; day++) {
            const dayDiv = document.createElement('div');
            dayDiv.className = 'day-box';
            if (diaSeleccionado === day) dayDiv.classList.add('selected');

            // Fecha en string (YYYY-MM-DD) para buscar en reservasGlobal
            const fechaStr = formatearFechaServidor(currentYear, currentMonth, day);
            const reservasDelDia = reservasGlobal[fechaStr] || [];
            const disponibles = ALL_SLOTS.filter(h => !reservasDelDia.includes(h));

            dayDiv.innerHTML = `<div class="day-number">${day}</div>`;

            if (disponibles.length > 0) {
                dayDiv.innerHTML += `
                    <button class="btn-elegir" onclick="seleccionarDia(${day})">Elegir hs</button>
                    <button class="btn-reservar" onclick="abrirModal(${day})">RESERVAR</button>
                `;
            } else {
                dayDiv.innerHTML += `<div class="sin-turnos">Sin turnos</div>`;
            }

            dayDiv.onclick = function() { seleccionarDia(day); };
            grid.appendChild(dayDiv);
        }
    }

    // ============================================================
    // MANEJADORES DE EVENTOS
    // ============================================================
    function seleccionarDia(day) {
        diaSeleccionado = day;
        horaSeleccionada = null;
        renderizarCalendario(); // Refresca el borde dorado del día
        mostrarHorarios(day);
    }

    function mostrarHorarios(day) {
        const container = document.getElementById('slotsContainer');
        const fechaStr = formatearFechaServidor(currentYear, currentMonth, day);
        const reservasDelDia = reservasGlobal[fechaStr] || [];
        const disponibles = ALL_SLOTS.filter(h => !reservasDelDia.includes(h));

        let html = `<p style="color:#e0e0e0; font-weight:500;">Horarios disponibles para ${fechaStr}:</p><div class="slots-list">`;
        
        if (disponibles.length === 0) {
            html = `<p style="color:#888;">No hay horarios disponibles para este día.</p>`;
        } else {
            ALL_SLOTS.forEach(hora => {
                const disponible = disponibles.includes(hora);
                html += `<div class="slot-item ${disponible ? 'available' : ''}" onclick="${disponible ? `seleccionarHora('${hora}')` : ''}">
                            ${hora}
                         </div>`;
            });
        }
        html += `</div>`;
        container.innerHTML = html;
    }

    function seleccionarHora(hora) {
        horaSeleccionada = hora;
        // Resaltar la hora seleccionada en la lista visualmente
        const slots = document.querySelectorAll('.slot-item');
        slots.forEach(s => s.classList.remove('selected-slot'));
        Array.from(slots).find(s => s.textContent.trim() === hora)?.classList.add('selected-slot');
        
        // Desplazarse suavemente al botón de reservar
        const btnReservar = document.querySelector('.day-box.selected .btn-reservar');
        if(btnReservar) btnReservar.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function abrirModal(day) {
        if (!horaSeleccionada) {
            alert('Por favor, primero hacé clic en un horario disponible ("Elegir hs")');
            return;
        }
        const fechaStr = formatearFechaServidor(currentYear, currentMonth, day);
        document.getElementById('modalInfo').textContent = `📆 ${fechaStr} - 🕒 ${horaSeleccionada}`;
        document.getElementById('modalReserva').style.display = 'flex';
    }

    function cerrarModal() {
        document.getElementById('modalReserva').style.display = 'none';
    }

    async function guardarReserva() {
        const cliente = document.getElementById('inputCliente').value.trim();
        const telefono = document.getElementById('inputTelefono').value.trim();
        const notas = document.getElementById('inputNotas').value.trim();
        const fechaStr = formatearFechaServidor(currentYear, currentMonth, diaSeleccionado);

        if (!cliente || !telefono) {
            alert('Completá tu nombre y teléfono.');
            return;
        }

        const payload = {
            fecha: fechaStr,
            hora: horaSeleccionada,
            cliente: cliente,
            telefono: telefono,
            notas: notas
        };

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            const text = await response.text();
            
            if (text === 'OK') {
                alert('✅ ¡Reserva confirmada! Te llegará un correo.');
                cerrarModal();
                cargarReservas(); // Recargar las reservas para actualizar el calendario
            } else {
                alert('❌ Error al guardar: ' + text);
            }
        } catch (error) {
            alert('Error de conexión: ' + error.message);
        }
    }

    function cambiarMes(direccion) {
        currentMonth += direccion;
        if (currentMonth > 11) { currentMonth = 0; currentYear++; }
        if (currentMonth < 0) { currentMonth = 11; currentYear--; }
        diaSeleccionado = null;
        horaSeleccionada = null;
        renderizarCalendario();
        document.getElementById('slotsContainer').innerHTML = `<p>Seleccioná un día del calendario para ver los horarios disponibles.</p>`;
    }

    // ============================================================
    // INICIALIZACIÓN
    // ============================================================
    cargarReservas();

</script>
</body>
</html>
