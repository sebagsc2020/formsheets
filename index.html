<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Reservas - Calendario Semanal</title>
    <style>
        /* ===== TODOS LOS ESTILOS (MISMO QUE ANTES) ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            background: #1a1a1a;
            padding: 15px 12px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            max-width: 1100px;
            width: 100%;
            border: 1px solid #2a2a2a;
        }

        h1 {
            text-align: center;
            color: #d0d0d0;
            font-weight: 600;
            font-size: clamp(20px, 5vw, 28px);
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 15px;
            font-size: clamp(12px, 2.5vw, 15px);
        }

        .loading-overlay {
            display: none;
            text-align: center;
            padding: 20px;
            color: #e8c84a;
            font-weight: 500;
        }

        .loading-overlay.show {
            display: block;
        }

        .loading-overlay .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #2a2a2a;
            border-top: 3px solid #d4a820;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .week-navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #141414;
            padding: 10px 12px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid #2a2a2a;
            flex-wrap: wrap;
            gap: 8px;
        }

        .week-nav-btn {
            background: #222;
            color: #c0c0c0;
            border: 1px solid #333;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: clamp(11px, 2vw, 14px);
            cursor: pointer;
            transition: background 0.25s, transform 0.1s, border-color 0.25s;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .week-nav-btn:hover:not(:disabled) {
            background: #333;
            border-color: #c8a020;
        }

        .week-nav-btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        .week-nav-btn:disabled {
            opacity: 0.25;
            cursor: not-allowed;
            transform: none;
        }

        .week-info {
            font-size: clamp(13px, 2.5vw, 18px);
            font-weight: 600;
            color: #d0d0d0;
            text-align: center;
            flex: 1;
            min-width: 120px;
        }

        .week-info span {
            color: #e8c84a;
        }

        .today-btn {
            background: #222;
            color: #c0c0c0;
            border: 1px solid #333;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: clamp(11px, 2vw, 13px);
            cursor: pointer;
            transition: all 0.25s;
            white-space: nowrap;
        }

        .today-btn:hover:not(:disabled) {
            background: #333;
            border-color: #c8a020;
        }

        .today-btn:disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }

        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-bottom: 20px;
            border-radius: 12px;
            background: #111;
            padding: 2px;
        }

        .table-wrapper::-webkit-scrollbar {
            height: 6px;
        }

        .table-wrapper::-webkit-scrollbar-track {
            background: #1a1a1a;
            border-radius: 10px;
        }

        .table-wrapper::-webkit-scrollbar-thumb {
            background: #3a3220;
            border-radius: 10px;
        }

        .table-wrapper::-webkit-scrollbar-thumb:hover {
            background: #5a4a2a;
        }

        .schedule-table {
            width: 100%;
            min-width: 620px;
            border-collapse: collapse;
            font-size: clamp(11px, 2.2vw, 14px);
            border-radius: 12px;
            overflow: hidden;
        }

        .schedule-table th {
            background: #111;
            color: #b0b0b0;
            padding: 8px 4px;
            font-weight: 600;
            font-size: clamp(10px, 2vw, 14px);
            border-bottom: 2px solid #2a2a2a;
            position: sticky;
            top: 0;
            z-index: 10;
            min-width: 60px;
        }

        .schedule-table th .day-date {
            display: block;
            font-size: clamp(8px, 1.5vw, 12px);
            font-weight: 400;
            opacity: 0.6;
            margin-top: 2px;
        }

        .schedule-table th.weekend {
            background: #0e0e0e;
        }

        .schedule-table th.today-header {
            background: #1f1a0e;
            color: #e8d48a;
            border-bottom: 3px solid #d4a820;
            box-shadow: 0 0 30px rgba(212, 168, 32, 0.06);
        }

        .schedule-table th.today-header .day-date {
            color: #aa9a66;
            opacity: 1;
        }

        .schedule-table th.today-header .today-badge {
            background: #d4a820;
            color: #1a1a1a;
            font-size: 8px;
            padding: 1px 8px;
            border-radius: 10px;
            display: inline-block;
            margin-top: 2px;
            font-weight: 700;
            letter-spacing: 0.3px;
            box-shadow: 0 0 20px rgba(212, 168, 32, 0.15);
        }

        .schedule-table td {
            padding: 6px 3px;
            text-align: center;
            border-bottom: 1px solid #2a2a2a;
            background: #1a1a1a;
            transition: background 0.2s;
            min-width: 44px;
        }

        .schedule-table tr:last-child td {
            border-bottom: none;
        }

        .schedule-table .time-col {
            font-weight: 600;
            color: #999;
            background: #141414;
            width: 50px;
            min-width: 44px;
            font-size: clamp(10px, 1.8vw, 13px);
            border-right: 1px solid #2a2a2a;
            position: sticky;
            left: 0;
            z-index: 5;
        }

        .schedule-table tr.separator-row td {
            background: #111;
            border-bottom: 3px solid #3a3220;
            padding: 3px 3px;
            height: 16px;
        }

        .schedule-table tr.separator-row td .separator-text {
            font-size: clamp(8px, 1.5vw, 11px);
            color: #8a7a4a;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: #1a1610;
            padding: 1px 12px;
            border-radius: 10px;
            display: inline-block;
            border: 1px solid #3a3220;
        }

        .schedule-table td.today-column {
            background: #1f1a0e;
            position: relative;
            border-left: 1px solid #6a5a20;
            border-right: 1px solid #6a5a20;
        }

        .schedule-table td.today-column::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at center, rgba(212, 168, 32, 0.04) 0%, transparent 70%);
            pointer-events: none;
        }

        .schedule-table td.today-column.past {
            background: #161410;
            opacity: 0.5;
        }

        .schedule-table td.today-column.reserved {
            background: #1f1a10;
            border-left: 2px solid #d4a820;
            border-right: 2px solid #d4a820;
        }

        .schedule-table td.today-column.reserved::after {
            content: '📌';
            font-size: 10px;
            margin-left: 2px;
            opacity: 0.7;
        }

        .schedule-table td.today-column.selected {
            background: #2a2214;
            box-shadow: inset 0 0 0 2px #d4a820, 0 0 25px rgba(212, 168, 32, 0.06);
        }

        .schedule-table td.today-column .slot-radio:checked {
            accent-color: #d4a820;
        }

        .schedule-table tr.separator-row td.today-column {
            background: #161410;
            border-left: 2px solid #6a5a20;
            border-right: 2px solid #6a5a20;
        }

        .schedule-table input[type="radio"] {
            width: clamp(16px, 3.5vw, 20px);
            height: clamp(16px, 3.5vw, 20px);
            accent-color: #666;
            cursor: pointer;
            transition: transform 0.15s;
            position: relative;
            z-index: 1;
            touch-action: manipulation;
        }

        .schedule-table input[type="radio"]:hover:not(:disabled) {
            transform: scale(1.15);
        }

        .schedule-table input[type="radio"]:active:not(:disabled) {
            transform: scale(0.9);
        }

        .schedule-table input[type="radio"]:disabled {
            accent-color: #333;
            cursor: not-allowed;
            opacity: 0.3;
        }

        .schedule-table td.reserved {
            background: #2a2a2a;
            position: relative;
        }

        .schedule-table td.reserved::after {
            content: '📌';
            font-size: 10px;
            margin-left: 2px;
            opacity: 0.5;
        }

        .schedule-table td.past {
            background: #161616;
            opacity: 0.4;
        }

        .schedule-table td.selected {
            background: #333;
            box-shadow: inset 0 0 0 2px #555;
        }

        .reservation-form {
            background: #141414;
            padding: 16px 14px;
            border-radius: 14px;
            border: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .form-group label {
            font-size: clamp(12px, 2.2vw, 14px);
            font-weight: 600;
            color: #999;
            margin-bottom: 4px;
            letter-spacing: 0.3px;
        }

        .form-group input {
            padding: 10px 14px;
            border: 1.5px solid #2a2a2a;
            border-radius: 10px;
            font-size: clamp(14px, 2.5vw, 16px);
            background: #111;
            color: #d0d0d0;
            transition: border 0.2s, box-shadow 0.2s;
            outline: none;
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
        }

        .form-group input::placeholder {
            color: #555;
        }

        .form-group input:focus {
            border-color: #c8a020;
            box-shadow: 0 0 0 3px rgba(200, 160, 32, 0.05);
        }

        .form-group input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 30px #111 inset !important;
            -webkit-text-fill-color: #d0d0d0 !important;
        }

        .btn-reserve {
            background: #222;
            color: #d0d0d0;
            border: 1px solid #333;
            padding: 12px 20px;
            border-radius: 30px;
            font-weight: 600;
            font-size: clamp(15px, 2.8vw, 18px);
            cursor: pointer;
            transition: background 0.25s, transform 0.1s, border-color 0.25s;
            width: 100%;
            letter-spacing: 0.5px;
            touch-action: manipulation;
        }

        .btn-reserve:hover:not(:disabled) {
            background: #2a2418;
            border-color: #c8a020;
        }

        .btn-reserve:active:not(:disabled) {
            transform: scale(0.97);
        }

        .btn-reserve:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            padding: 12px 16px;
            background: #141414;
            border-left: 5px solid #333;
            color: #c0c0c0;
            border-radius: 10px;
            font-weight: 500;
            display: none;
            font-size: clamp(13px, 2.2vw, 15px);
        }

        .message.show {
            display: block;
        }

        .message.error {
            border-left-color: #cc3333;
            background: #1a0e0e;
            color: #ff6b6b;
        }

        .message.success {
            border-left-color: #c8a020;
            background: #1a1610;
            color: #d4c88a;
        }

        .cookie-notice {
            background: #111;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            text-align: center;
        }

        .cookie-notice p {
            margin: 0;
            font-size: clamp(12px, 2vw, 14px);
            color: #888;
        }

        .cookie-notice button {
            background: #222;
            color: #d0d0d0;
            border: 1px solid #333;
            padding: 6px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: clamp(12px, 2vw, 13px);
            transition: all 0.25s;
            touch-action: manipulation;
        }

        .cookie-notice button:hover {
            background: #2a2418;
            border-color: #c8a020;
        }

        .debug-info {
            background: #111;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 10px 14px;
            margin-top: 10px;
            font-size: 11px;
            color: #666;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            word-break: break-all;
        }

        .debug-info .debug-title {
            color: #8a7a4a;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .debug-info .debug-item {
            padding: 2px 0;
            border-bottom: 1px solid #1a1a1a;
            color: #999;
        }

        .debug-info .debug-item .key {
            color: #e8c84a;
        }

        .debug-info .debug-error {
            color: #ff6b6b;
            padding: 4px 0;
        }

        @media (max-width: 480px) {
            .container { padding: 10px 8px; border-radius: 12px; }
            .week-navigation { padding: 8px 10px; gap: 6px; }
            .week-nav-btn { padding: 5px 10px; font-size: 10px; }
            .today-btn { padding: 5px 12px; font-size: 10px; }
            .week-info { font-size: 11px; min-width: 80px; }
            .schedule-table { min-width: 480px; font-size: 10px; }
            .schedule-table th { padding: 6px 2px; font-size: 9px; min-width: 40px; }
            .schedule-table th .day-date { font-size: 7px; }
            .schedule-table td { padding: 4px 2px; min-width: 32px; }
            .schedule-table .time-col { width: 36px; min-width: 32px; font-size: 9px; }
            .schedule-table input[type="radio"] { width: 14px; height: 14px; }
            .schedule-table tr.separator-row td .separator-text { font-size: 7px; padding: 1px 8px; letter-spacing: 1px; }
            .reservation-form { padding: 12px 10px; gap: 10px; }
            .form-group input { padding: 8px 12px; font-size: 14px; }
            .btn-reserve { padding: 10px 16px; font-size: 14px; }
            .message { padding: 10px 14px; font-size: 12px; }
            .debug-info { font-size: 9px; max-height: 120px; }
        }

        @media (max-width: 380px) {
            .schedule-table { min-width: 400px; font-size: 9px; }
            .schedule-table th { padding: 4px 1px; font-size: 8px; min-width: 30px; }
            .schedule-table th .day-date { font-size: 6px; }
            .schedule-table td { padding: 3px 1px; min-width: 26px; }
            .schedule-table .time-col { width: 30px; min-width: 26px; font-size: 8px; }
            .schedule-table input[type="radio"] { width: 12px; height: 12px; }
            .week-nav-btn { padding: 4px 8px; font-size: 9px; }
            .today-btn { padding: 4px 10px; font-size: 9px; }
            .week-info { font-size: 10px; }
        }

        @media (min-width: 769px) {
            .reservation-form { flex-direction: row; flex-wrap: wrap; align-items: flex-end; }
            .form-group { flex: 1 1 160px; min-width: 140px; }
            .btn-reserve { width: auto; margin-left: auto; min-width: 130px; }
            .cookie-notice { flex-direction: row; justify-content: space-between; text-align: left; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📅 Reserva tu Horario</h1>
    <p class="subtitle">Selecciona un único día y hora para tu reserva</p>

    <div class="cookie-notice" id="cookieNotice">
        <p>🍪 Usamos cookies para recordar tus datos.</p>
        <button id="acceptCookies">Aceptar</button>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <p>Cargando disponibilidad...</p>
    </div>

    <div class="week-navigation">
        <button class="week-nav-btn" id="prevWeek">◀ Semana anterior</button>
        <div class="week-info">
            <span id="weekLabel">Semana del</span>
            <span id="weekRange">01/08/2026 - 07/08/2026</span>
        </div>
        <div style="display: flex; gap: 6px;">
            <button class="today-btn" id="todayBtn">📌 Hoy</button>
            <button class="week-nav-btn" id="nextWeek">Semana siguiente ▶</button>
        </div>
    </div>

    <div class="table-wrapper">
        <table class="schedule-table" id="scheduleTable">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <form id="reservationForm" class="reservation-form">
        <div class="form-group">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej: Ana Pérez" autocomplete="name" required>
        </div>
        <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" placeholder="ana@email.com" autocomplete="email" required>
        </div>
        <div class="form-group">
            <label for="telefono">Teléfono</label>
            <input type="tel" id="telefono" name="telefono" placeholder="+34 600 000 000" autocomplete="tel">
        </div>
        <button type="submit" class="btn-reserve" id="submitBtn" disabled>Selecciona un horario</button>
    </form>

    <div id="message" class="message"></div>

    <!-- PANEL DE DEPURACIÓN -->
    <div class="debug-info" id="debugInfo">
        <div class="debug-title">🔍 DEPURACIÓN</div>
        <div id="debugContent"></div>
    </div>
</div>

<script>
    (function() {
        // ============================================================
        // 🔴 CONFIGURACIÓN - REEMPLAZA CON TU URL DE APPS SCRIPT 🔴
        // ============================================================
        const API_URL = 'https://script.google.com/macros/s/AKfycbw0hv5_qhV3iS18Tu7Z0FwQKvywAiqO-p_OFAPM29x-42rnxVRoV78CqwmiMUWJLre_aA/exec';
        
        // ============================================================
        // CONFIGURACIÓN DE HORARIOS
        // ============================================================
        const HORAS_MANANA = ['9:00', '10:00', '11:00', '12:00'];
        const HORAS_TARDE = ['16:00', '17:00', '18:00', '19:00', '20:00'];
        const DIAS_SEMANA = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
        const FECHA_INICIO = new Date(2026, 7, 1);

        // ============================================================
        // ESTADO
        // ============================================================
        let currentWeekStart = getWeekStart(FECHA_INICIO);
        let reservas = {};
        let selectedSlot = null;
        let cookiesAccepted = false;
        let isLoading = false;

        // ============================================================
        // ELEMENTOS DOM
        // ============================================================
        const tableHead = document.getElementById('tableHead');
        const tableBody = document.getElementById('tableBody');
        const weekRange = document.getElementById('weekRange');
        const weekLabel = document.getElementById('weekLabel');
        const prevBtn = document.getElementById('prevWeek');
        const nextBtn = document.getElementById('nextWeek');
        const todayBtn = document.getElementById('todayBtn');
        const form = document.getElementById('reservationForm');
        const messageDiv = document.getElementById('message');
        const submitBtn = document.getElementById('submitBtn');
        const cookieNotice = document.getElementById('cookieNotice');
        const acceptBtn = document.getElementById('acceptCookies');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const debugContent = document.getElementById('debugContent');

        // ============================================================
        // UTILIDADES
        // ============================================================
        function setCookie(name, value, days = 365) {
            const date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            document.cookie = `${name}=${encodeURIComponent(JSON.stringify(value))}; expires=${date.toUTCString()}; path=/; SameSite=Lax`;
        }

        function getCookie(name) {
            const cookieName = `${name}=`;
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                cookie = cookie.trim();
                if (cookie.indexOf(cookieName) === 0) {
                    try { return JSON.parse(decodeURIComponent(cookie.substring(cookieName.length))); }
                    catch (e) { return null; }
                }
            }
            return null;
        }

        function getWeekStart(date) {
            const d = new Date(date);
            const day = d.getDay();
            const diff = (day === 0) ? 6 : day - 1;
            d.setDate(d.getDate() - diff);
            d.setHours(0, 0, 0, 0);
            return d;
        }

        function addWeeks(date, weeks) {
            const d = new Date(date);
            d.setDate(d.getDate() + (weeks * 7));
            return d;
        }

        function formatDate(date) {
            const d = new Date(date);
            return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
        }

        function formatDateKey(date) {
            const d = new Date(date);
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function getDateForDay(weekStart, dayIndex) {
            const d = new Date(weekStart);
            d.setDate(d.getDate() + dayIndex);
            return d;
        }

        function isSameDate(d1, d2) {
            return d1.getFullYear() === d2.getFullYear() && d1.getMonth() === d2.getMonth() && d1.getDate() === d2.getDate();
        }

        function isPastDate(date) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            return date < today;
        }

        function isBeforeSiteStart(date) {
            const start = new Date(FECHA_INICIO);
            start.setHours(0, 0, 0, 0);
            return date < start;
        }

        // ============================================================
        // DEPURACIÓN
        // ============================================================
        function actualizarDebug(mensaje, tipo = 'info') {
            const colors = {
                info: '#999',
                success: '#4caf50',
                error: '#ff6b6b',
                warning: '#ffa726'
            };
            const iconos = {
                info: 'ℹ️',
                success: '✅',
                error: '❌',
                warning: '⚠️'
            };
            const html = `<div class="debug-item" style="color:${colors[tipo] || '#999'}">${iconos[tipo] || '•'} ${mensaje}</div>`;
            debugContent.innerHTML += html;
            debugContent.scrollTop = debugContent.scrollHeight;
        }

        function limpiarDebug() {
            debugContent.innerHTML = '';
        }

        // ============================================================
        // API - GOOGLE SHEETS
        // ============================================================
        async function cargarReservasDesdeAPI() {
            try {
                mostrarLoading(true);
                limpiarDebug();
                actualizarDebug('🔄 Cargando reservas desde Google Sheets...', 'info');
                actualizarDebug(`📡 URL: ${API_URL}`, 'info');
                
                const response = await fetch(API_URL);
                
                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status} ${response.statusText}`);
                }
                
                const data = await response.json();
                actualizarDebug(`📦 Respuesta recibida: ${JSON.stringify(data).substring(0, 200)}...`, 'info');
                
                if (data.success) {
                    reservas = {};
                    
                    data.reservas.forEach(r => {
                        const key = `${r.fecha}_${r.hora}`;
                        reservas[key] = {
                            nombre: r.nombre || '',
                            email: r.email || '',
                            telefono: r.telefono || ''
                        };
                        actualizarDebug(`📌 ${key} → ${r.nombre}`, 'success');
                    });
                    
                    actualizarDebug(`📊 Total de reservas cargadas: ${Object.keys(reservas).length}`, 'success');
                    return true;
                } else {
                    actualizarDebug(`❌ Error: ${data.error || 'Error desconocido'}`, 'error');
                    return false;
                }
            } catch (error) {
                actualizarDebug(`❌ Error de conexión: ${error.message}`, 'error');
                actualizarDebug(`💡 Verifica que la URL de la API sea correcta y esté publicada`, 'warning');
                actualizarDebug(`💡 La URL debe terminar en /exec`, 'warning');
                return false;
            } finally {
                mostrarLoading(false);
            }
        }

        async function guardarReservaEnAPI(fecha, hora, nombre, email, telefono) {
            try {
                actualizarDebug(`📤 Enviando reserva: ${fecha} ${hora} - ${nombre}`, 'info');
                
                const response = await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fecha, hora, nombre, email, telefono: telefono || '' })
                });

                actualizarDebug(`✅ Reserva enviada correctamente (no-cors)`, 'success');
                return { success: true };
                
            } catch (error) {
                actualizarDebug(`❌ Error al guardar: ${error.message}`, 'error');
                return { success: false, error: error.message };
            }
        }

        // ============================================================
        // LOADING
        // ============================================================
        function mostrarLoading(show) {
            isLoading = show;
            const wrapper = document.querySelector('.table-wrapper');
            if (show) {
                loadingOverlay.classList.add('show');
                if (wrapper) { wrapper.style.opacity = '0.3'; wrapper.style.pointerEvents = 'none'; }
            } else {
                loadingOverlay.classList.remove('show');
                if (wrapper) { wrapper.style.opacity = '1'; wrapper.style.pointerEvents = 'auto'; }
            }
        }

        // ============================================================
        // GENERAR TABLA
        // ============================================================
        function renderTable(weekStart) {
            const startDate = new Date(weekStart);
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            actualizarDebug(`🎨 Renderizando tabla para semana: ${formatDate(startDate)}`, 'info');
            actualizarDebug(`📊 Reservas disponibles: ${Object.keys(reservas).length}`, 'info');
            
            // Encabezado
            let theadHTML = '<tr><th>Hora</th>';
            for (let i = 0; i < 6; i++) {
                const date = getDateForDay(startDate, i);
                const dayName = DIAS_SEMANA[i];
                const dateStr = formatDate(date);
                const isWeekend = (i === 5) ? 'weekend' : '';
                const isToday = isSameDate(date, today);
                const todayClass = isToday ? 'today-header' : '';
                
                theadHTML += `<th class="${isWeekend} ${todayClass}">${dayName}<span class="day-date">${dateStr}</span>`;
                if (isToday) theadHTML += ` <span class="today-badge">✦ HOY</span>`;
                theadHTML += `</th>`;
            }
            theadHTML += '</tr>';
            tableHead.innerHTML = theadHTML;

            // Cuerpo
            let tbodyHTML = '';
            
            HORAS_MANANA.forEach(hora => {
                tbodyHTML += generarFilaHora(hora, startDate, today);
            });
            
            // Separador
            tbodyHTML += `<tr class="separator-row">`;
            tbodyHTML += `<td class="time-col" style="background:#111; text-align:center; font-size:clamp(8px,1.5vw,11px); color:#8a7a4a; font-weight:600;">⏰</td>`;
            for (let i = 0; i < 6; i++) {
                const date = getDateForDay(startDate, i);
                const isToday = isSameDate(date, today);
                const todayClass = isToday ? 'today-column' : '';
                tbodyHTML += `<td class="${todayClass}" style="background:#111; border-bottom: 3px solid #3a3220; text-align:center; font-size:clamp(7px,1.2vw,10px); color:#8a7a4a; font-weight:500; letter-spacing:1px;">
                    <span class="separator-text">⏳ TARDE</span>
                </td>`;
            }
            tbodyHTML += `</tr>`;
            
            HORAS_TARDE.forEach(hora => {
                tbodyHTML += generarFilaHora(hora, startDate, today);
            });
            
            tableBody.innerHTML = tbodyHTML;

            // Actualizar rango
            const endDate = addWeeks(startDate, 1);
            endDate.setDate(endDate.getDate() - 1);
            weekRange.textContent = `${formatDate(startDate)} - ${formatDate(endDate)}`;
            weekLabel.textContent = 'Semana del';

            // Botones
            const todayWeekStart = getWeekStart(today);
            const startWeek = getWeekStart(FECHA_INICIO);
            const diffWeeks = Math.floor((startDate - startWeek) / (7 * 24 * 60 * 60 * 1000));
            prevBtn.disabled = (diffWeeks <= 0);
            todayBtn.disabled = isSameDate(startDate, todayWeekStart);

            updateSubmitButton();
            attachRadioEvents();
        }

        function generarFilaHora(hora, startDate, today) {
            let html = `<tr><td class="time-col">${hora}</td>`;
            for (let i = 0; i < 6; i++) {
                const date = getDateForDay(startDate, i);
                const dateKey = formatDateKey(date);
                const radioId = `${dateKey}_${hora}`;
                const isPast = isPastDate(date) || isBeforeSiteStart(date);
                const isReserved = reservas[radioId] !== undefined;
                const isSelected = selectedSlot && selectedSlot.dateKey === dateKey && selectedSlot.time === hora;
                const isToday = isSameDate(date, today);
                
                let tdClass = '';
                if (isPast) tdClass += 'past ';
                if (isReserved) tdClass += 'reserved ';
                if (isSelected) tdClass += 'selected ';
                if (isToday) tdClass += 'today-column ';
                
                html += `<td class="${tdClass}">`;
                html += `<input type="radio" class="slot-radio" name="slot" id="${radioId}" 
                               data-date="${dateKey}" data-time="${hora}" 
                               ${isSelected ? 'checked' : ''} 
                               ${(isPast || isReserved) ? 'disabled' : ''}>`;
                html += '</td>';
            }
            html += '</tr>';
            return html;
        }

        function attachRadioEvents() {
            document.querySelectorAll('input[name="slot"]').forEach(radio => {
                radio.removeEventListener('change', handleRadioChange);
                radio.addEventListener('change', handleRadioChange);
            });
        }

        function handleRadioChange(e) {
            const radio = e.target;
            if (radio.checked) {
                const dateKey = radio.getAttribute('data-date');
                const time = radio.getAttribute('data-time');
                
                if (selectedSlot) {
                    const prevId = `${selectedSlot.dateKey}_${selectedSlot.time}`;
                    const prevRadio = document.getElementById(prevId);
                    if (prevRadio) {
                        prevRadio.checked = false;
                        const parentTd = prevRadio.closest('td');
                        if (parentTd) parentTd.classList.remove('selected');
                    }
                }
                
                selectedSlot = { dateKey, time };
                const parentTd = radio.closest('td');
                if (parentTd) parentTd.classList.add('selected');
                updateSubmitButton();
                messageDiv.classList.remove('show');
            }
        }

        function updateSubmitButton() {
            if (selectedSlot) {
                submitBtn.disabled = false;
                submitBtn.textContent = '✦ Confirmar Reserva';
            } else {
                submitBtn.disabled = true;
                submitBtn.textContent = 'Selecciona un horario';
            }
        }

        // ============================================================
        // NAVEGACIÓN
        // ============================================================
        function goToWeek(weeksOffset) {
            const newWeek = addWeeks(currentWeekStart, weeksOffset);
            currentWeekStart = newWeek;
            selectedSlot = null;
            renderTable(currentWeekStart);
            messageDiv.classList.remove('show');
        }

        function goToToday() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            currentWeekStart = getWeekStart(today);
            selectedSlot = null;
            renderTable(currentWeekStart);
            messageDiv.classList.remove('show');
        }

        function mostrarMensaje(texto, tipo = 'success') {
            messageDiv.textContent = texto;
            messageDiv.className = 'message show';
            messageDiv.classList.add(tipo === 'error' ? 'error' : 'success');
        }

        // ============================================================
        // ENVÍO DEL FORMULARIO
        // ============================================================
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            if (!selectedSlot) {
                mostrarMensaje('⚠️ Debes seleccionar un horario.', 'error');
                return;
            }

            if (isLoading) {
                mostrarMensaje('⏳ Espera a que termine de cargar...', 'error');
                return;
            }

            const nombre = document.getElementById('nombre').value.trim();
            const email = document.getElementById('email').value.trim();
            const telefono = document.getElementById('telefono').value.trim();

            if (!nombre || nombre.length < 2) {
                mostrarMensaje('⚠️ Ingresa un nombre válido.', 'error');
                return;
            }

            if (!email || !email.includes('@') || !email.includes('.')) {
                mostrarMensaje('⚠️ Ingresa un correo válido.', 'error');
                return;
            }

            const slotId = `${selectedSlot.dateKey}_${selectedSlot.time}`;
            
            if (reservas[slotId]) {
                mostrarMensaje('⚠️ Este horario ya fue reservado.', 'error');
                selectedSlot = null;
                await cargarReservasDesdeAPI();
                renderTable(currentWeekStart);
                return;
            }

            mostrarLoading(true);
            const result = await guardarReservaEnAPI(
                selectedSlot.dateKey,
                selectedSlot.time,
                nombre,
                email,
                telefono
            );
            
            await new Promise(resolve => setTimeout(resolve, 1500));
            await cargarReservasDesdeAPI();
            mostrarLoading(false);

            if (result.success) {
                reservas[slotId] = { nombre, email, telefono };
                saveToCookies();

                const [year, month, day] = selectedSlot.dateKey.split('-');
                const dateObj = new Date(year, month - 1, day);
                const dateStr = formatDate(dateObj);
                
                messageDiv.className = 'message show success';
                messageDiv.innerHTML = `
                    ✦ <strong>¡Reserva confirmada!</strong><br>
                    <span style="font-weight:400;">${nombre}, tu reserva para el <strong>${dateStr}</strong> a las <strong>${selectedSlot.time}</strong> ha sido registrada.</span><br>
                    <span style="font-size:clamp(12px,2vw,14px); opacity:0.6;">Te enviaremos un correo a ${email} con los detalles.</span>
                `;

                selectedSlot = null;
                renderTable(currentWeekStart);
            } else {
                mostrarMensaje('⚠️ Error al guardar la reserva. Intenta de nuevo.', 'error');
                renderTable(currentWeekStart);
            }
        });

        // ============================================================
        // COOKIES
        // ============================================================
        function loadFromCookies() {
            const savedData = getCookie('reservas_data');
            if (savedData && savedData.user) {
                document.getElementById('nombre').value = savedData.user.nombre || '';
                document.getElementById('email').value = savedData.user.email || '';
                document.getElementById('telefono').value = savedData.user.telefono || '';
                return true;
            }
            return false;
        }

        function saveToCookies() {
            if (!cookiesAccepted) return;
            setCookie('reservas_data', {
                user: {
                    nombre: document.getElementById('nombre').value.trim(),
                    email: document.getElementById('email').value.trim(),
                    telefono: document.getElementById('telefono').value.trim()
                }
            });
        }

        function autoSaveUserData() {
            ['nombre', 'email', 'telefono'].forEach(id => {
                document.getElementById(id).addEventListener('input', () => {
                    if (cookiesAccepted) saveToCookies();
                });
            });
        }

        acceptBtn.addEventListener('click', function() {
            cookiesAccepted = true;
            cookieNotice.style.display = 'none';
            saveToCookies();
            autoSaveUserData();
        });

        // ============================================================
        // INICIALIZAR
        // ============================================================
        async function init() {
            actualizarDebug('🚀 Iniciando aplicación...', 'info');
            
            const savedData = getCookie('reservas_data');
            if (savedData) {
                cookiesAccepted = true;
                cookieNotice.style.display = 'none';
                loadFromCookies();
                autoSaveUserData();
                actualizarDebug('🍪 Datos de cookies cargados', 'success');
            }

            await cargarReservasDesdeAPI();

            const today = new Date();
            today.setHours(0, 0, 0, 0);
            currentWeekStart = today < FECHA_INICIO ? getWeekStart(FECHA_INICIO) : getWeekStart(today);
            
            renderTable(currentWeekStart);
            actualizarDebug('✅ Aplicación iniciada correctamente', 'success');
            actualizarDebug(`📅 Semana actual: ${formatDate(currentWeekStart)}`, 'info');
        }

        // ============================================================
        // EVENTOS
        // ============================================================
        prevBtn.addEventListener('click', () => goToWeek(-1));
        nextBtn.addEventListener('click', () => goToWeek(1));
        todayBtn.addEventListener('click', goToToday);

        init();

    })();
</script>

</body>
</html>
