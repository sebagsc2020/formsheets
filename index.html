<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Reservas - Calendario Semanal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            background: #1a1a1a;
            padding: 15px 12px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            max-width: 1100px;
            width: 100%;
            border: 1px solid #2a2a2a;
        }

        h1 {
            text-align: center;
            color: #d0d0d0;
            font-weight: 600;
            font-size: clamp(20px, 5vw, 28px);
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 15px;
            font-size: clamp(12px, 2.5vw, 15px);
        }

        .loading-overlay {
            display: none;
            text-align: center;
            padding: 20px;
            color: #e8c84a;
            font-weight: 500;
        }

        .loading-overlay.show {
            display: block;
        }

        .loading-overlay .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #2a2a2a;
            border-top: 3px solid #d4a820;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* === NAVEGACIÓN SEMANAL === */
        .week-navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #141414;
            padding: 10px 12px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid #2a2a2a;
            flex-wrap: wrap;
            gap: 8px;
        }

        .week-nav-btn {
            background: #222;
            color: #c0c0c0;
            border: 1px solid #333;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: clamp(11px, 2vw, 14px);
            cursor: pointer;
            transition: background 0.25s, transform 0.1s, border-color 0.25s;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .week-nav-btn:hover:not(:disabled) {
            background: #333;
            border-color: #c8a020;
        }

        .week-nav-btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        .week-nav-btn:disabled {
            opacity: 0.25;
            cursor: not-allowed;
            transform: none;
        }

        .week-info {
            font-size: clamp(13px, 2.5vw, 18px);
            font-weight: 600;
            color: #d0d0d0;
            text-align: center;
            flex: 1;
            min-width: 120px;
        }

        .week-info span {
            color: #e8c84a;
        }

        .today-btn {
            background: #222;
            color: #c0c0c0;
            border: 1px solid #333;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: clamp(11px, 2vw, 13px);
            cursor: pointer;
            transition: all 0.25s;
            white-space: nowrap;
        }

        .today-btn:hover:not(:disabled) {
            background: #333;
            border-color: #c8a020;
        }

        .today-btn:disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }

        /* === CONTENEDOR TABLA CON SCROLL === */
        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-bottom: 20px;
            border-radius: 12px;
            background: #111;
            padding: 2px;
        }

        .table-wrapper::-webkit-scrollbar {
            height: 6px;
        }

        .table-wrapper::-webkit-scrollbar-track {
            background: #1a1a1a;
            border-radius: 10px;
        }

        .table-wrapper::-webkit-scrollbar-thumb {
            background: #3a3220;
            border-radius: 10px;
        }

        .table-wrapper::-webkit-scrollbar-thumb:hover {
            background: #5a4a2a;
        }

        /* === TABLA DE HORARIOS === */
        .schedule-table {
            width: 100%;
            min-width: 620px;
            border-collapse: collapse;
            font-size: clamp(11px, 2.2vw, 14px);
            border-radius: 12px;
            overflow: hidden;
        }

        .schedule-table th {
            background: #111;
            color: #b0b0b0;
            padding: 8px 4px;
            font-weight: 600;
            font-size: clamp(10px, 2vw, 14px);
            border-bottom: 2px solid #2a2a2a;
            position: sticky;
            top: 0;
            z-index: 10;
            min-width: 60px;
        }

        .schedule-table th .day-date {
            display: block;
            font-size: clamp(8px, 1.5vw, 12px);
            font-weight: 400;
            opacity: 0.6;
            margin-top: 2px;
        }

        .schedule-table th.weekend {
            background: #0e0e0e;
        }

        .schedule-table th.today-header {
            background: #1f1a0e;
            color: #e8d48a;
            border-bottom: 3px solid #d4a820;
            box-shadow: 0 0 30px rgba(212, 168, 32, 0.06);
        }

        .schedule-table th.today-header .day-date {
            color: #aa9a66;
            opacity: 1;
        }

        .schedule-table th.today-header .today-badge {
            background: #d4a820;
            color: #1a1a1a;
            font-size: 8px;
            padding: 1px 8px;
            border-radius: 10px;
            display: inline-block;
            margin-top: 2px;
            font-weight: 700;
            letter-spacing: 0.3px;
            box-shadow: 0 0 20px rgba(212, 168, 32, 0.15);
        }

        .schedule-table td {
            padding: 6px 3px;
            text-align: center;
            border-bottom: 1px solid #2a2a2a;
            background: #1a1a1a;
            transition: background 0.2s;
            min-width: 44px;
        }

        .schedule-table tr:last-child td {
            border-bottom: none;
        }

        .schedule-table .time-col {
            font-weight: 600;
            color: #999;
            background: #141414;
            width: 50px;
            min-width: 44px;
            font-size: clamp(10px, 1.8vw, 13px);
            border-right: 1px solid #2a2a2a;
            position: sticky;
            left: 0;
            z-index: 5;
        }

        /* Fila separadora */
        .schedule-table tr.separator-row td {
            background: #111;
            border-bottom: 3px solid #3a3220;
            padding: 3px 3px;
            height: 16px;
        }

        .schedule-table tr.separator-row td .separator-text {
            font-size: clamp(8px, 1.5vw, 11px);
            color: #8a7a4a;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: #1a1610;
            padding: 1px 12px;
            border-radius: 10px;
            display: inline-block;
            border: 1px solid #3a3220;
        }

        /* Columna del día actual */
        .schedule-table td.today-column {
            background: #1f1a0e;
            position: relative;
            border-left: 1px solid #6a5a20;
            border-right: 1px solid #6a5a20;
        }

        .schedule-table td.today-column::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at center, rgba(212, 168, 32, 0.04) 0%, transparent 70%);
            pointer-events: none;
        }

        .schedule-table td.today-column.past {
            background: #161410;
            opacity: 0.5;
        }

        .schedule-table td.today-column.reserved {
            background: #1f1a10;
            border-left: 2px solid #d4a820;
            border-right: 2px solid #d4a820;
        }

        .schedule-table td.today-column.reserved::after {
            content: '📌';
            font-size: 10px;
            margin-left: 2px;
            opacity: 0.7;
        }

        .schedule-table td.today-column.selected {
            background: #2a2214;
            box-shadow: inset 0 0 0 2px #d4a820, 0 0 25px rgba(212, 168, 32, 0.06);
        }

        .schedule-table td.today-column .slot-radio:checked {
            accent-color: #d4a820;
        }

        .schedule-table tr.separator-row td.today-column {
            background: #161410;
            border-left: 2px solid #6a5a20;
            border-right: 2px solid #6a5a20;
        }

        .schedule-table input[type="radio"] {
            width: clamp(16px, 3.5vw, 20px);
            height: clamp(16px, 3.5vw, 20px);
            accent-color: #666;
            cursor: pointer;
            transition: transform 0.15s;
            position: relative;
            z-index: 1;
            touch-action: manipulation;
        }

        .schedule-table input[type="radio"]:hover:not(:disabled) {
            transform: scale(1.15);
        }

        .schedule-table input[type="radio"]:active:not(:disabled) {
            transform: scale(0.9);
        }

        .schedule-table input[type="radio"]:disabled {
            accent-color: #333;
            cursor: not-allowed;
            opacity: 0.3;
        }

        .schedule-table td.reserved {
            background: #2a2a2a;
            position: relative;
        }

        .schedule-table td.reserved::after {
            content: '📌';
            font-size: 10px;
            margin-left: 2px;
            opacity: 0.5;
        }

        .schedule-table td.past {
            background: #161616;
            opacity: 0.4;
        }

        .schedule-table td.selected {
            background: #333;
            box-shadow: inset 0 0 0 2px #555;
        }

        /* === FORMULARIO === */
        .reservation-form {
            background: #141414;
            padding: 16px 14px;
            border-radius: 14px;
            border: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .form-group label {
            font-size: clamp(12px, 2.2vw, 14px);
            font-weight: 600;
            color: #999;
            margin-bottom: 4px;
            letter-spacing: 0.3px;
        }

        .form-group input {
            padding: 10px 14px;
            border: 1.5px solid #2a2a2a;
            border-radius: 10px;
            font-size: clamp(14px, 2.5vw, 16px);
            background: #111;
            color: #d0d0d0;
            transition: border 0.2s, box-shadow 0.2s;
            outline: none;
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
        }

        .form-group input::placeholder {
            color: #555;
        }

        .form-group input:focus {
            border-color: #c8a020;
            box-shadow: 0 0 0 3px rgba(200, 160, 32, 0.05);
        }

        .form-group input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 30px #111 inset !important;
            -webkit-text-fill-color: #d0d0d0 !important;
        }

        .btn-reserve {
            background: #222;
            color: #d0d0d0;
            border: 1px solid #333;
            padding: 12px 20px;
            border-radius: 30px;
            font-weight: 600;
            font-size: clamp(15px, 2.8vw, 18px);
            cursor: pointer;
            transition: background 0.25s, transform 0.1s, border-color 0.25s;
            width: 100%;
            letter-spacing: 0.5px;
            touch-action: manipulation;
        }

        .btn-reserve:hover:not(:disabled) {
            background: #2a2418;
            border-color: #c8a020;
        }

        .btn-reserve:active:not(:disabled) {
            transform: scale(0.97);
        }

        .btn-reserve:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            padding: 12px 16px;
            background: #141414;
            border-left: 5px solid #333;
            color: #c0c0c0;
            border-radius: 10px;
            font-weight: 500;
            display: none;
            font-size: clamp(13px, 2.2vw, 15px);
        }

        .message.show {
            display: block;
        }

        .message.error {
            border-left-color: #cc3333;
            background: #1a0e0e;
            color: #ff6b6b;
        }

        .message.success {
            border-left-color: #c8a020;
            background: #1a1610;
            color: #d4c88a;
        }

        .cookie-notice {
            background: #111;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            text-align: center;
        }

        .cookie-notice p {
            margin: 0;
            font-size: clamp(12px, 2vw, 14px);
            color: #888;
        }

        .cookie-notice button {
            background: #222;
            color: #d0d0d0;
            border: 1px solid #333;
            padding: 6px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: clamp(12px, 2vw, 13px);
            transition: all 0.25s;
            touch-action: manipulation;
        }

        .cookie-notice button:hover {
            background: #2a2418;
            border-color: #c8a020;
        }

        /* === MEDIA QUERIES === */
        @media (max-width: 480px) {
            .container {
                padding: 10px 8px;
                border-radius: 12px;
            }

            .week-navigation {
                padding: 8px 10px;
                gap: 6px;
            }

            .week-nav-btn {
                padding: 5px 10px;
                font-size: 10px;
            }

            .today-btn {
                padding: 5px 12px;
                font-size: 10px;
            }

            .week-info {
                font-size: 11px;
                min-width: 80px;
            }

            .schedule-table {
                min-width: 480px;
                font-size: 10px;
            }

            .schedule-table th {
                padding: 6px 2px;
                font-size: 9px;
                min-width: 40px;
            }

            .schedule-table th .day-date {
                font-size: 7px;
            }

            .schedule-table td {
                padding: 4px 2px;
                min-width: 32px;
            }

            .schedule-table .time-col {
                width: 36px;
                min-width: 32px;
                font-size: 9px;
            }

            .schedule-table input[type="radio"] {
                width: 14px;
                height: 14px;
            }

            .schedule-table tr.separator-row td .separator-text {
                font-size: 7px;
                padding: 1px 8px;
                letter-spacing: 1px;
            }

            .reservation-form {
                padding: 12px 10px;
                gap: 10px;
            }

            .form-group input {
                padding: 8px 12px;
                font-size: 14px;
            }

            .btn-reserve {
                padding: 10px 16px;
                font-size: 14px;
            }

            .message {
                padding: 10px 14px;
                font-size: 12px;
            }
        }

        @media (max-width: 380px) {
            .schedule-table {
                min-width: 400px;
                font-size: 9px;
            }

            .schedule-table th {
                padding: 4px 1px;
                font-size: 8px;
                min-width: 30px;
            }

            .schedule-table th .day-date {
                font-size: 6px;
            }

            .schedule-table td {
                padding: 3px 1px;
                min-width: 26px;
            }

            .schedule-table .time-col {
                width: 30px;
                min-width: 26px;
                font-size: 8px;
            }

            .schedule-table input[type="radio"] {
                width: 12px;
                height: 12px;
            }

            .week-nav-btn {
                padding: 4px 8px;
                font-size: 9px;
            }

            .today-btn {
                padding: 4px 10px;
                font-size: 9px;
            }

            .week-info {
                font-size: 10px;
            }
        }

        @media (min-width: 769px) {
            .reservation-form {
                flex-direction: row;
                flex-wrap: wrap;
                align-items: flex-end;
            }

            .form-group {
                flex: 1 1 160px;
                min-width: 140px;
            }

            .btn-reserve {
                width: auto;
                margin-left: auto;
                min-width: 130px;
            }

            .cookie-notice {
                flex-direction: row;
                justify-content: space-between;
                text-align: left;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📅 Reserva tu Horario</h1>
    <p class="subtitle">Selecciona un único día y hora para tu reserva</p>

    <!-- AVISO DE COOKIES -->
    <div class="cookie-notice" id="cookieNotice">
        <p>🍪 Usamos cookies para recordar tus datos.</p>
        <button id="acceptCookies">Aceptar</button>
    </div>

    <!-- CARGANDO -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <p>Cargando disponibilidad...</p>
    </div>

    <!-- NAVEGACIÓN SEMANAL -->
    <div class="week-navigation">
        <button class="week-nav-btn" id="prevWeek">◀ Semana anterior</button>
        
        <div class="week-info">
            <span id="weekLabel">Semana del</span>
            <span id="weekRange">01/08/2026 - 07/08/2026</span>
        </div>
        
        <div style="display: flex; gap: 6px;">
            <button class="today-btn" id="todayBtn">📌 Hoy</button>
            <button class="week-nav-btn" id="nextWeek">Semana siguiente ▶</button>
        </div>
    </div>

    <!-- TABLA DE HORARIOS CON SCROLL -->
    <div class="table-wrapper">
        <table class="schedule-table" id="scheduleTable">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <!-- FORMULARIO -->
    <form id="reservationForm" class="reservation-form">
        <div class="form-group">
            <label for="nombre">Nombre completo</label>
            <input 
                type="text" 
                id="nombre" 
                name="nombre"
                placeholder="Ej: Ana Pérez" 
                autocomplete="name"
                required
            >
        </div>

        <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input 
                type="email" 
                id="email" 
                name="email"
                placeholder="ana@email.com" 
                autocomplete="email"
                required
            >
        </div>

        <div class="form-group">
            <label for="telefono">Teléfono</label>
            <input 
                type="tel" 
                id="telefono" 
                name="telefono"
                placeholder="+34 600 000 000" 
                autocomplete="tel"
            >
        </div>

        <button type="submit" class="btn-reserve" id="submitBtn" disabled>Selecciona un horario</button>
    </form>

    <div id="message" class="message"></div>
</div>

<script>
    (function() {
        // ============================================================
        // CONFIGURACIÓN
        // ============================================================
        // 🔴 REEMPLAZA ESTA URL CON LA DE TU APPS SCRIPT 🔴
        const API_URL = 'https://script.google.com/macros/s/AKfycbz3bwmvYxuQierHehE8FGXqKL0HAI58WUo9DZ8sb_rFbgHhKqrYsQg7Y2UsnuvxautH/exec';
        
        // ============================================================
        // CONFIGURACIÓN DE HORARIOS
        // ============================================================
        const HORAS_MANANA = ['9:00', '10:00', '11:00', '12:00'];
        const HORAS_TARDE = ['16:00', '17:00', '18:00', '19:00', '20:00'];
        const DIAS_SEMANA = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
        const FECHA_INICIO = new Date(2026, 7, 1);

        // ============================================================
        // ESTADO
        // ============================================================
        let currentWeekStart = getWeekStart(FECHA_INICIO);
        let reservas = {};
        let selectedSlot = null;
        let cookiesAccepted = false;
        let isLoading = false;

        // ============================================================
        // ELEMENTOS DOM
        // ============================================================
        const tableHead = document.getElementById('tableHead');
        const tableBody = document.getElementById('tableBody');
        const weekRange = document.getElementById('weekRange');
        const weekLabel = document.getElementById('weekLabel');
        const prevBtn = document.getElementById('prevWeek');
        const nextBtn = document.getElementById('nextWeek');
        const todayBtn = document.getElementById('todayBtn');
        const form = document.getElementById('reservationForm');
        const messageDiv = document.getElementById('message');
        const submitBtn = document.getElementById('submitBtn');
        const cookieNotice = document.getElementById('cookieNotice');
        const acceptBtn = document.getElementById('acceptCookies');
        const loadingOverlay = document.getElementById('loadingOverlay');

        // ============================================================
        // UTILIDADES DE COOKIES
        // ============================================================
        function setCookie(name, value, days = 365) {
            const date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = `expires=${date.toUTCString()}`;
            document.cookie = `${name}=${encodeURIComponent(JSON.stringify(value))}; ${expires}; path=/; SameSite=Lax`;
        }

        function getCookie(name) {
            const cookieName = `${name}=`;
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                cookie = cookie.trim();
                if (cookie.indexOf(cookieName) === 0) {
                    const value = cookie.substring(cookieName.length);
                    try {
                        return JSON.parse(decodeURIComponent(value));
                    } catch (e) {
                        return null;
                    }
                }
            }
            return null;
        }

        // ============================================================
        // FUNCIONES DE FECHAS
        // ============================================================
        function getWeekStart(date) {
            const d = new Date(date);
            const day = d.getDay();
            const diff = (day === 0) ? 6 : day - 1;
            d.setDate(d.getDate() - diff);
            d.setHours(0, 0, 0, 0);
            return d;
        }

        function addWeeks(date, weeks) {
            const d = new Date(date);
            d.setDate(d.getDate() + (weeks * 7));
            return d;
        }

        function formatDate(date) {
            const d = new Date(date);
            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const year = d.getFullYear();
            return `${day}/${month}/${year}`;
        }

        function formatDateKey(date) {
            const d = new Date(date);
            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const year = d.getFullYear();
            return `${year}-${month}-${day}`;
        }

        function getDateForDay(weekStart, dayIndex) {
            const d = new Date(weekStart);
            d.setDate(d.getDate() + dayIndex);
            return d;
        }

        function isSameDate(d1, d2) {
            return d1.getFullYear() === d2.getFullYear() &&
                   d1.getMonth() === d2.getMonth() &&
                   d1.getDate() === d2.getDate();
        }

        function isPastDate(date) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            return date < today;
        }

        function isBeforeSiteStart(date) {
            const start = new Date(FECHA_INICIO);
            start.setHours(0, 0, 0, 0);
            return date < start;
        }

        // ============================================================
        // API - GOOGLE SHEETS
        // ============================================================
        async function cargarReservasDesdeAPI() {
            try {
                mostrarLoading(true);
                const response = await fetch(API_URL);
                const data = await response.json();
                
                if (data.success) {
                    // Convertir array de reservas a objeto para acceso rápido
                    reservas = {};
                    data.reservas.forEach(r => {
                        const key = `${r.fecha}_${r.hora}`;
                        reservas[key] = {
                            nombre: r.nombre,
                            email: r.email,
                            telefono: r.telefono
                        };
                    });
                    return true;
                } else {
                    console.error('Error al cargar reservas:', data.error);
                    mostrarMensaje('⚠️ Error al cargar disponibilidad. Intenta de nuevo.', 'error');
                    return false;
                }
            } catch (error) {
                console.error('Error de conexión:', error);
                mostrarMensaje('⚠️ Error de conexión. Verifica tu internet.', 'error');
                return false;
            } finally {
                mostrarLoading(false);
            }
        }

        async function guardarReservaEnAPI(fecha, hora, nombre, email, telefono) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        fecha: fecha,
                        hora: hora,
                        nombre: nombre,
                        email: email,
                        telefono: telefono || ''
                    })
                });

                // Con no-cors no podemos leer la respuesta directamente
                // Pero la petición se envió, confiamos en que el servidor la procesó
                return { success: true };
                
            } catch (error) {
                console.error('Error al guardar:', error);
                return { success: false, error: error.toString() };
            }
        }

        // ============================================================
        // LOADING
        // ============================================================
        function mostrarLoading(show) {
            isLoading = show;
            if (show) {
                loadingOverlay.classList.add('show');
                document.querySelector('.table-wrapper').style.opacity = '0.3';
                document.querySelector('.table-wrapper').style.pointerEvents = 'none';
            } else {
                loadingOverlay.classList.remove('show');
                document.querySelector('.table-wrapper').style.opacity = '1';
                document.querySelector('.table-wrapper').style.pointerEvents = 'auto';
            }
        }

        // ============================================================
        // GESTIÓN DE COOKIES
        // ============================================================
        function loadFromCookies() {
            const savedData = getCookie('reservas_data');
            if (savedData && savedData.user) {
                document.getElementById('nombre').value = savedData.user.nombre || '';
                document.getElementById('email').value = savedData.user.email || '';
                document.getElementById('telefono').value = savedData.user.telefono || '';
                return true;
            }
            return false;
        }

        function saveToCookies() {
            if (!cookiesAccepted) return;
            
            const data = {
                user: {
                    nombre: document.getElementById('nombre').value.trim(),
                    email: document.getElementById('email').value.trim(),
                    telefono: document.getElementById('telefono').value.trim()
                }
            };
            setCookie('reservas_data', data);
        }

        function autoSaveUserData() {
            const inputs = ['nombre', 'email', 'telefono'];
            inputs.forEach(id => {
                const input = document.getElementById(id);
                input.addEventListener('input', function() {
                    if (cookiesAccepted) {
                        saveToCookies();
                    }
                });
            });
        }

        // ============================================================
        // GENERAR TABLA
        // ============================================================
        function renderTable(weekStart) {
            const startDate = new Date(weekStart);
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            // Generar encabezado
            let theadHTML = '<tr><th>Hora</th>';
            for (let i = 0; i < 6; i++) {
                const date = getDateForDay(startDate, i);
                const dayName = DIAS_SEMANA[i];
                const dateStr = formatDate(date);
                const isWeekend = (i === 5);
                const weekendClass = isWeekend ? 'weekend' : '';
                const isToday = isSameDate(date, today);
                const todayClass = isToday ? 'today-header' : '';
                
                theadHTML += `<th class="${weekendClass} ${todayClass}">${dayName}<span class="day-date">${dateStr}</span>`;
                if (isToday) {
                    theadHTML += ` <span class="today-badge">✦ HOY</span>`;
                }
                theadHTML += `</th>`;
            }
            theadHTML += '</tr>';
            tableHead.innerHTML = theadHTML;

            // Generar cuerpo
            let tbodyHTML = '';
            
            HORAS_MANANA.forEach(hora => {
                tbodyHTML += generarFilaHora(hora, startDate, today);
            });
            
            // FILA SEPARADORA
            tbodyHTML += `<tr class="separator-row">`;
            tbodyHTML += `<td class="time-col" style="background:#111; text-align:center; font-size:clamp(8px,1.5vw,11px); color:#8a7a4a; font-weight:600;">⏰</td>`;
            for (let i = 0; i < 6; i++) {
                const date = getDateForDay(startDate, i);
                const isToday = isSameDate(date, today);
                const todayClass = isToday ? 'today-column' : '';
                tbodyHTML += `<td class="${todayClass}" style="background:#111; border-bottom: 3px solid #3a3220; text-align:center; font-size:clamp(7px,1.2vw,10px); color:#8a7a4a; font-weight:500; letter-spacing:1px;">
                    <span class="separator-text">⏳ TARDE</span>
                </td>`;
            }
            tbodyHTML += `</tr>`;
            
            HORAS_TARDE.forEach(hora => {
                tbodyHTML += generarFilaHora(hora, startDate, today);
            });
            
            tableBody.innerHTML = tbodyHTML;

            // Actualizar rango de fechas
            const endDate = addWeeks(startDate, 1);
            endDate.setDate(endDate.getDate() - 1);
            weekRange.textContent = `${formatDate(startDate)} - ${formatDate(endDate)}`;
            weekLabel.textContent = 'Semana del';

            // Actualizar botones de navegación
            const todayWeekStart = getWeekStart(today);
            
            const startWeek = getWeekStart(FECHA_INICIO);
            const diffWeeks = Math.floor((startDate - startWeek) / (7 * 24 * 60 * 60 * 1000));
            prevBtn.disabled = (diffWeeks <= 0);

            if (isSameDate(startDate, todayWeekStart)) {
                todayBtn.disabled = true;
            } else {
                todayBtn.disabled = false;
            }

            updateSubmitButton();
            attachRadioEvents();
        }

        // ============================================================
        // FUNCIÓN PARA GENERAR FILA DE HORA
        // ============================================================
        function generarFilaHora(hora, startDate, today) {
            let html = `<tr><td class="time-col">${hora}</td>`;
            for (let i = 0; i < 6; i++) {
                const date = getDateForDay(startDate, i);
                const dateKey = formatDateKey(date);
                const radioId = `${dateKey}_${hora}`;
                const isPast = isPastDate(date) || isBeforeSiteStart(date);
                const isReserved = reservas[radioId] !== undefined;
                const isSelected = selectedSlot && selectedSlot.dateKey === dateKey && selectedSlot.time === hora;
                const isToday = isSameDate(date, today);
                
                let tdClass = '';
                if (isPast) tdClass += 'past ';
                if (isReserved) tdClass += 'reserved ';
                if (isSelected) tdClass += 'selected ';
                if (isToday) tdClass += 'today-column ';
                
                html += `<td class="${tdClass}">`;
                
                const disabled = isPast || isReserved;
                const checked = isSelected ? 'checked' : '';
                
                html += `<input type="radio" 
                               class="slot-radio"
                               name="slot" 
                               id="${radioId}" 
                               data-date="${dateKey}" 
                               data-time="${hora}"
                               ${checked}
                               ${disabled ? 'disabled' : ''}
                        >`;
                
                html += '</td>';
            }
            html += '</tr>';
            return html;
        }

        // ============================================================
        // EVENTOS DE RADIO
        // ============================================================
        function attachRadioEvents() {
            document.querySelectorAll('input[name="slot"]').forEach(radio => {
                radio.removeEventListener('change', handleRadioChange);
                radio.addEventListener('change', handleRadioChange);
            });
        }

        function handleRadioChange(e) {
            const radio = e.target;
            if (radio.checked) {
                const dateKey = radio.getAttribute('data-date');
                const time = radio.getAttribute('data-time');
                
                if (selectedSlot) {
                    const prevId = `${selectedSlot.dateKey}_${selectedSlot.time}`;
                    const prevRadio = document.getElementById(prevId);
                    if (prevRadio) {
                        prevRadio.checked = false;
                        const parentTd = prevRadio.closest('td');
                        if (parentTd) parentTd.classList.remove('selected');
                    }
                }
                
                selectedSlot = { dateKey, time };
                
                const parentTd = radio.closest('td');
                if (parentTd) parentTd.classList.add('selected');
                
                updateSubmitButton();
                messageDiv.classList.remove('show');
            }
        }

        // ============================================================
        // ACTUALIZAR BOTÓN DE SUBMIT
        // ============================================================
        function updateSubmitButton() {
            if (selectedSlot) {
                submitBtn.disabled = false;
                submitBtn.textContent = '✦ Confirmar Reserva';
            } else {
                submitBtn.disabled = true;
                submitBtn.textContent = 'Selecciona un horario';
            }
        }

        // ============================================================
        // NAVEGACIÓN
        // ============================================================
        function goToWeek(weeksOffset) {
            const newWeek = addWeeks(currentWeekStart, weeksOffset);
            currentWeekStart = newWeek;
            selectedSlot = null;
            renderTable(currentWeekStart);
            messageDiv.classList.remove('show');
        }

        function goToToday() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const todayWeekStart = getWeekStart(today);
            currentWeekStart = todayWeekStart;
            selectedSlot = null;
            renderTable(currentWeekStart);
            messageDiv.classList.remove('show');
        }

        // ============================================================
        // MENSAJES
        // ============================================================
        function mostrarMensaje(texto, tipo = 'success') {
            messageDiv.textContent = texto;
            messageDiv.className = 'message show';
            if (tipo === 'error') {
                messageDiv.classList.add('error');
            } else {
                messageDiv.classList.add('success');
            }
        }

        // ============================================================
        // ENVÍO DEL FORMULARIO
        // ============================================================
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            if (!selectedSlot) {
                mostrarMensaje('⚠️ Debes seleccionar un horario.', 'error');
                return;
            }

            if (isLoading) {
                mostrarMensaje('⏳ Espera a que termine de cargar...', 'error');
                return;
            }

            const nombre = document.getElementById('nombre').value.trim();
            const email = document.getElementById('email').value.trim();
            const telefono = document.getElementById('telefono').value.trim();

            if (!nombre || nombre.length < 2) {
                mostrarMensaje('⚠️ Por favor, ingresa un nombre válido.', 'error');
                return;
            }

            if (!email || !email.includes('@') || !email.includes('.')) {
                mostrarMensaje('⚠️ Ingresa un correo electrónico válido.', 'error');
                return;
            }

            const slotId = `${selectedSlot.dateKey}_${selectedSlot.time}`;
            
            // Verificar que el horario no haya sido reservado mientras tanto
            if (reservas[slotId]) {
                mostrarMensaje('⚠️ Este horario ya fue reservado. Por favor, selecciona otro.', 'error');
                selectedSlot = null;
                // Recargar reservas
                await cargarReservasDesdeAPI();
                renderTable(currentWeekStart);
                return;
            }

            // Guardar en Google Sheets
            mostrarLoading(true);
            const result = await guardarReservaEnAPI(
                selectedSlot.dateKey,
                selectedSlot.time,
                nombre,
                email,
                telefono
            );
            mostrarLoading(false);

            if (result.success) {
                // Guardar localmente
                reservas[slotId] = { nombre, email, telefono };
                saveToCookies();

                const [year, month, day] = selectedSlot.dateKey.split('-');
                const dateObj = new Date(year, month - 1, day);
                const dateStr = formatDate(dateObj);
                
                messageDiv.className = 'message show success';
                messageDiv.innerHTML = `
                    ✦ <strong>¡Reserva confirmada!</strong><br>
                    <span style="font-weight:400;">${nombre}, tu reserva para el <strong>${dateStr}</strong> a las <strong>${selectedSlot.time}</strong> ha sido registrada.</span><br>
                    <span style="font-size:clamp(12px,2vw,14px); opacity:0.6;">Te enviaremos un correo a ${email} con los detalles.</span>
                `;

                console.log('Reserva confirmada:', {
                    nombre,
                    email,
                    telefono,
                    fecha: dateStr,
                    hora: selectedSlot.time,
                    dateKey: selectedSlot.dateKey
                });

                selectedSlot = null;
                renderTable(currentWeekStart);
            } else {
                mostrarMensaje('⚠️ Error al guardar la reserva. Intenta de nuevo.', 'error');
                // Recargar reservas para asegurar consistencia
                await cargarReservasDesdeAPI();
                renderTable(currentWeekStart);
            }
        });

        // ============================================================
        // COOKIES - ACEPTAR
        // ============================================================
        acceptBtn.addEventListener('click', function() {
            cookiesAccepted = true;
            cookieNotice.style.display = 'none';
            saveToCookies();
            autoSaveUserData();
        });

        // ============================================================
        // INICIALIZAR
        // ============================================================
        async function init() {
            // Cargar datos de cookies
            const savedData = getCookie('reservas_data');
            if (savedData) {
                cookiesAccepted = true;
                cookieNotice.style.display = 'none';
                loadFromCookies();
                autoSaveUserData();
            }

            // Cargar reservas desde Google Sheets
            await cargarReservasDesdeAPI();

            // Configurar semana inicial
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const todayWeekStart = getWeekStart(today);
            
            if (today < FECHA_INICIO) {
                currentWeekStart = getWeekStart(FECHA_INICIO);
            } else {
                currentWeekStart = todayWeekStart;
            }
            
            renderTable(currentWeekStart);
        }

        // ============================================================
        // EVENTOS DE NAVEGACIÓN
        // ============================================================
        prevBtn.addEventListener('click', () => goToWeek(-1));
        nextBtn.addEventListener('click', () => goToWeek(1));
        todayBtn.addEventListener('click', goToToday);

        // ============================================================
        // INICIAR
        // ============================================================
        init();

    })();
</script>

</body>
</html>
