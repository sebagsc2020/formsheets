<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva tu Horario</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ... (todos los estilos iguales que antes, no los repito por espacio) ... */
        /* Usa los mismos estilos que ya tenías */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: #1a1a1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        .card {
            max-width: 900px;
            width: 100%;
            background: #2a2a2a;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 8px 20px rgba(0, 0, 0, 0.4);
            padding: 2rem 2rem 2.5rem;
            transition: all 0.2s;
            border: 1px solid #3a3a3a;
        }

        /* ... resto de estilos ... */
        /* (mantén tus estilos actuales) */
    </style>
</head>
<body>
    <!-- ... (mismo HTML que antes) ... -->
    
    <script>
        (function() {
            // ---------- CONFIGURACIÓN ----------
            // ⚠️ REEMPLAZA ESTA URL CON LA NUEVA URL DE TU APLICACIÓN WEB
            const GOOGLE_SHEETS_URL = 'https://script.google.com/macros/s/AKfycbwV-dgJmL_L3Ov878UoBrA0zH5IBGpFgim3M66U2Tv9ctWAlPeUrX7Tx0m_H0_0Q4w0XA/exec';
            
            // ... (resto de variables y funciones iguales) ...
            
            // ---------- CARGAR RESERVAS DESDE GOOGLE SHEETS ----------
            async function loadReservationsFromSheets() {
                try {
                    const response = await fetch(GOOGLE_SHEETS_URL, {
                        method: 'GET',
                        headers: {
                            'Content-Type': 'application/json',
                        }
                    });
                    
                    if (!response.ok) {
                        throw new Error('Error al cargar reservas');
                    }
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        return result.reservas || [];
                    } else {
                        console.error('Error al cargar reservas:', result.error);
                        return [];
                    }
                } catch (error) {
                    console.error('Error al cargar reservas:', error);
                    return [];
                }
            }

            // ---------- ACTUALIZAR TABLA CON RESERVAS ----------
            function updateTableWithReservations(reservas) {
                // Crear un Set con los horarios reservados para búsqueda rápida
                const reservados = new Set();
                reservas.forEach(r => {
                    // Formato: "Lun 03 10:00" o "Jue 06 10:00"
                    const clave = `${r.fecha} ${r.hora}`;
                    reservados.add(clave);
                });
                
                // Recorrer todos los radios y deshabilitar los reservados
                const radios = document.querySelectorAll('input[name="slot"]');
                radios.forEach(radio => {
                    const valor = radio.value;
                    if (reservados.has(valor)) {
                        radio.disabled = true;
                        // Marcar visualmente como reservado
                        const cell = radio.closest('td');
                        if (cell) {
                            cell.classList.remove('available-cell');
                            cell.classList.add('reserved-cell');
                        }
                    }
                });
            }

            // ---------- RENDERIZAR TABLA (MODIFICADA) ----------
            async function renderTable() {
                const today = getToday();

                let headerHtml = '<th>Hora</th>';
                for (let i = 0; i < daysOfWeek.length; i++) {
                    const date = getDateForWeekday(currentWeekStart, i);
                    const dayLabel = daysOfWeek[i];
                    const dayNumber = formatDate(date);
                    const isTodayClass = isToday(date) ? 'today-header' : '';
                    headerHtml += `<th class="${isTodayClass}">${dayLabel} ${dayNumber}</th>`;
                }
                headerRow.innerHTML = headerHtml;

                let bodyHtml = '';

                morningHours.forEach(hour => {
                    bodyHtml += `<tr><td class="time-slot"><i class="far fa-clock"></i> ${hour}:00</td>`;
                    for (let i = 0; i < daysOfWeek.length; i++) {
                        const date = getDateForWeekday(currentWeekStart, i);
                        const dayNumber = formatDate(date);
                        const dayLabel = daysOfWeek[i];
                        const value = `${dayLabel} ${dayNumber} ${hour}:00`;
                        const isPastOrCurrent = isPastOrCurrentSlot(currentWeekStart, i, hour);
                        
                        // Inicialmente, solo deshabilitamos por hora pasada
                        // Las reservas se aplicarán después con updateTableWithReservations
                        const disabled = isPastOrCurrent ? 'disabled' : '';
                        
                        let cellClass = '';
                        if (isToday(date)) {
                            cellClass = 'today-cell';
                        } else if (!isPastOrCurrent) {
                            cellClass = 'available-cell';
                        } else {
                            cellClass = 'disabled-cell';
                        }
                        
                        bodyHtml +=
                            `<td class="${cellClass}"><div class="slot-cell"><input type="radio" name="slot" value="${value}" ${disabled}></div></td>`;
                    }
                    bodyHtml += `</tr>`;
                });

                bodyHtml += `<tr class="afternoon-row">`;
                for (let i = 0; i <= 6; i++) {
                    const date = getDateForWeekday(currentWeekStart, i);
                    const isPastOrCurrent = isPastOrCurrentSlot(currentWeekStart, i, 16);
                    
                    let cellClass = '';
                    if (isToday(date)) {
                        cellClass = 'today-cell';
                    } else if (!isPastOrCurrent) {
                        cellClass = 'available-cell';
                    } else {
                        cellClass = 'disabled-cell';
                    }
                    
                    if (i === 0) {
                        bodyHtml += `<td class="${cellClass}" style="text-align: center; letter-spacing: 2px; font-weight: 600; color: #b0b0b0; font-size: 0.75rem;">
                            <i class="fas fa-sun" style="margin-right: 4px; color: #777777;"></i> TARDE
                        </td>`;
                    } else {
                        bodyHtml += `<td class="${cellClass}"></td>`;
                    }
                }
                bodyHtml += `</tr>`;

                afternoonHours.forEach(hour => {
                    bodyHtml += `<tr><td class="time-slot"><i class="far fa-clock"></i> ${hour}:00</td>`;
                    for (let i = 0; i < daysOfWeek.length; i++) {
                        const date = getDateForWeekday(currentWeekStart, i);
                        const dayNumber = formatDate(date);
                        const dayLabel = daysOfWeek[i];
                        const value = `${dayLabel} ${dayNumber} ${hour}:00`;
                        const isPastOrCurrent = isPastOrCurrentSlot(currentWeekStart, i, hour);
                        
                        const disabled = isPastOrCurrent ? 'disabled' : '';
                        
                        let cellClass = '';
                        if (isToday(date)) {
                            cellClass = 'today-cell';
                        } else if (!isPastOrCurrent) {
                            cellClass = 'available-cell';
                        } else {
                            cellClass = 'disabled-cell';
                        }
                        
                        bodyHtml +=
                            `<td class="${cellClass}"><div class="slot-cell"><input type="radio" name="slot" value="${value}" ${disabled}></div></td>`;
                    }
                    bodyHtml += `</tr>`;
                });

                tbody.innerHTML = bodyHtml;

                const monthName = getMonthName(currentWeekStart.getMonth());
                const year = currentWeekStart.getFullYear();
                weekLabel.textContent = `${monthName} ${year}`;

                // Agregar estilos para celdas reservadas
                const style = document.createElement('style');
                style.textContent = `
                    td.reserved-cell {
                        background: #3a2a2a !important;
                        opacity: 0.7 !important;
                        position: relative;
                    }
                    td.reserved-cell::after {
                        content: '✕';
                        position: absolute;
                        top: 50%;
                        left: 50%;
                        transform: translate(-50%, -50%);
                        color: #ff6b6b;
                        font-size: 0.8rem;
                        font-weight: bold;
                        opacity: 0.6;
                    }
                    td.reserved-cell .slot-cell input[type="radio"] {
                        opacity: 0.3;
                        cursor: not-allowed;
                        border-color: #3a3a3a;
                        background: #1a1a1a;
                    }
                `;
                document.head.appendChild(style);

                // Cargar reservas desde Google Sheets y actualizar tabla
                const reservas = await loadReservationsFromSheets();
                updateTableWithReservations(reservas);

                // Reasignar eventos a los radios
                const radios = document.querySelectorAll('input[name="slot"]');
                radios.forEach(radio => {
                    radio.addEventListener('change', function() {
                        updateFeedback();
                        saveFormDataToCookies();
                    });
                });

                const horarioGuardado = getCookie('reserva_horario');
                if (horarioGuardado) {
                    radios.forEach(radio => {
                        if (radio.value === horarioGuardado && !radio.disabled) {
                            radio.checked = true;
                        }
                    });
                }

                updateFeedback();
            }

            // ... (resto del código igual) ...

            // ---------- INICIALIZAR ----------
            loadFormDataFromCookies();
            renderTable();

            if (getCookie('cookies_aceptadas') === 'true') {
                document.getElementById('cookieNotice').style.display = 'none';
            }

        })();
    </script>
</body>
</html>
